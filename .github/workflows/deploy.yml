name: Deploy Root Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare root site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

          if [ -d "assets" ]; then
            cp -R assets _site/assets
          fi

          if [ -d "public" ]; then
            cp -R public/* _site/ 2>/dev/null || true
          fi

          if [ -f "favicon.svg" ]; then
            cp favicon.svg _site/favicon.svg
          fi

      - name: Handle SPA routing
        run: cp _site/index.html _site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4